# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

api_version = "2026-01"

[[extensions]]
name = "gift-options"
handle = "gift-options"
type = "ui_extension"
uid = "e9d6ae8a-fcc4-7d7b-852c-d64971c164137e02a950"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.shipping-option-list.render-after"

[extensions.capabilities]
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "max_message_length"
type = "number_integer"
name = "メッセージ最大文字数"
description = "ギフトメッセージの最大文字数（デフォルト: 200）"

[[extensions.settings.fields]]
key = "wrapping_enabled"
type = "boolean"
name = "ラッピングを有効にする"
description = "チェックアウト画面にラッピングオプションを表示する"
